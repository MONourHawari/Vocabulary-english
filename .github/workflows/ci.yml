name: CI

on:
  pull_request:
  push:
    branches-ignore: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validate words.json
        run: node scripts/validate-words.mjs

      - name: Preview today's Telegram message
        run: node scripts/daily-telegram.mjs --dry-run
