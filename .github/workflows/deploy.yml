name: Deploy site

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validate words.json
        run: node scripts/validate-words.mjs

      # Stamp the commit into the asset URLs so browsers never keep an old
      # app.js next to a new words.json.
      - name: Cache-bust assets
        run: sed -i "s/__BUILD__/${GITHUB_SHA::8}/g" index.html

      # Pages must be switched on once by hand (Settings → Pages → Source:
      # GitHub Actions): the workflow token is not allowed to create the site.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
